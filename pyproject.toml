[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "embodied-learning"
version = "0.1.0"
description = "Modular tools for embodied imitation learning and robot policy research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Embodied Learning Contributors" }]
dependencies = []

[project.optional-dependencies]
mapping = ["torch>=2.0"]
potential-fields = [
  "numpy>=1.24",
  "torch>=2.0",
  "scipy>=1.10",
  "scikit-fmm>=2025.6.23",
]
field-training = [
  "torch==2.7.1",
  "mjlab==1.6.0",
  "rsl-rl-lib==5.4.2",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.16.0",
  "scikit-fmm==2025.6.23",
  "scipy>=1.15",
  "numpy>=1.24",
  "tensordict>=0.7.0",
  "tensorboard>=2.20.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 85
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-select = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
